<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ferramentas · Grupo Humanidade</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b1220;color:#e8eefb;font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
  .wrap{width:100%;max-width:560px}
  h1{font-size:24px;font-weight:650;letter-spacing:-.02em}
  .sub{color:#93a3b8;font-size:14.5px;margin-top:6px}
  ul{list-style:none;margin-top:26px}
  li{margin-bottom:12px}
  a.card{display:block;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
         border-radius:13px;padding:17px 19px;text-decoration:none;color:inherit;transition:.15s}
  a.card:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.2)}
  .t{font-size:16.5px;font-weight:640}
  .d{font-size:13.2px;color:#93a3b8;margin-top:3px}
  .arrow{float:right;color:#60a5fa;font-size:18px;line-height:1.4}
  footer{margin-top:28px;color:#64748b;font-size:12px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ferramentas</h1>
  <p class="sub">Utilitários do Grupo Humanidade — abra e use, nada para instalar.</p>
  <ul>
    <li>
      <a class="card" href="./recibos/">
        <span class="arrow">→</span>
        <div class="t">Emissor de Recibos</div>
        <div class="d">Parque da Saudade · gera o recibo em PDF para o cliente</div>
      </a>
    </li>
  </ul>
  <footer>
    Grupo Humanidade<br>
    Precisa de uma ferramenta nova? Fale com o Ricardo.
  </footer>
</div>
</body>
</html>
