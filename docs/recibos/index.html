:root{
  --marrom:#42270C; --marrom-esc:#351F09; --dourado:#CC900B; --bege:#ECC685;
  --offwhite:#ECECE4; --papel:#F6F5EF; --cinza:#9A968E; --filete:#E6E6E6;
  --preto:#1A1A1A; --verde:#677F5F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Ingra","Inter",system-ui,-apple-system,sans-serif;
  background:#DED9CE; color:var(--preto); -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
h1,h2,h3,.serif{font-family:"PF Marlet Display","Playfair Display",serif}

/* ---------------------------------------------------- painel (só na tela) */
.painel{max-width:1000px;margin:0 auto;padding:18px 16px 28px}
.painel header{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.painel header svg{height:34px;width:auto}
.painel header .t{font-family:"PF Marlet Display",serif;font-size:19px;color:var(--marrom)}
.painel header .s{font-size:12px;color:#6b6459;margin-top:2px}
.card{background:#fff;border:1px solid #cfc9bd;border-radius:10px;padding:16px 16px 18px;margin-bottom:14px}
.card > h3{margin:0 0 12px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--marrom)}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(12,1fr)}
label{display:flex;flex-direction:column;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#7a7367;gap:4px}
input,select,textarea{
  font:inherit;font-size:14px;padding:8px 9px;border:1px solid #cfc9bd;border-radius:6px;
  background:#fdfcfa;color:var(--preto);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--dourado);outline-offset:-1px;border-color:var(--dourado)}
textarea{resize:vertical;min-height:56px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:13px;letter-spacing:0;color:var(--preto)}
.chk input{width:17px;height:17px;accent-color:var(--marrom)}
.acoes{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:#DED9CE;padding:12px 0 6px;margin-top:-4px}
button{
  font:inherit;font-size:14px;font-weight:500;padding:11px 20px;border-radius:8px;border:1px solid transparent;cursor:pointer;
}
.b1{background:var(--marrom);color:var(--offwhite)}
.b1:hover{background:var(--marrom-esc)}
.b2{background:#fff;color:var(--marrom);border-color:#cfc9bd}
.b2:hover{background:#f4f1eb}
.dica{font-size:12px;color:#6b6459;line-height:1.5}
.previa{max-width:1000px;margin:0 auto 30px;padding:0 16px}
.previa .rot{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6b6459;margin:0 0 8px}
.papelwrap{display:flex;flex-direction:column;align-items:center;gap:16px}

/* ---------------------------------------------------- a folha */
.folha{
  width:210mm;min-height:297mm;background:#fff;position:relative;
  padding:14mm 14mm 12mm;box-shadow:0 3px 14px rgba(0,0,0,.18);
  display:flex;flex-direction:column;
}
.folha::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--marrom)}
.folha::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--bege)}

.topo{display:flex;justify-content:space-between;align-items:flex-start}
.topo .logo svg{height:15mm;width:auto;display:block}
.topo .dir{text-align:right}
.topo .dir .tit{font-family:"PF Marlet Display",serif;font-size:21pt;color:var(--marrom);line-height:1}
.topo .dir .meta{font-size:8pt;color:var(--cinza);margin-top:5px;line-height:1.5}
.regua{height:1.2px;background:var(--dourado);margin:6mm 0 3mm}

.caixa{
  background:var(--papel);border:.8px solid var(--filete);border-left:3.5px solid var(--dourado);
  padding:4mm 5mm;display:flex;justify-content:space-between;align-items:flex-start;gap:10mm;
}
.caixa .rot{font-size:6.4pt;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza)}
.caixa .val{font-family:"PF Marlet Display",serif;font-size:25pt;color:var(--marrom);line-height:1.15;margin-top:2px}
.caixa .ext{font-size:8.4pt;margin-top:1px;line-height:1.35}
.caixa .dir{text-align:right;white-space:nowrap}
.caixa .dir .forma{font-size:11pt;margin-top:5px}
.caixa .dir .quando{font-size:7.6pt;color:var(--cinza);margin-top:5px}

.faixa{
  background:var(--marrom);border-left:3.5px solid var(--dourado);color:var(--offwhite);
  font-size:7.4pt;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;margin:4mm 0 0;
}
.secao{display:flex;flex-wrap:wrap;gap:0 10px;padding-top:9px}
.campo{flex:1 1 0;min-width:0;padding-bottom:3px;border-bottom:.6px solid var(--filete);margin-bottom:8px}
.campo .r{font-size:6.2pt;letter-spacing:.09em;text-transform:uppercase;color:var(--cinza);display:block}
.campo .v{font-size:9.5pt;line-height:1.35;min-height:13pt;display:block;
  white-space:normal;overflow-wrap:anywhere}
.campo .v.vazio{color:transparent}
.w1{flex-grow:1}.w2{flex-grow:2}.w3{flex-grow:3}.w4{flex-grow:4}
.w15{flex-grow:1.5}.w12{flex-grow:1.2}

.decl{font-size:9pt;line-height:1.38;margin-top:9px;text-align:justify}
.obsrot{font-size:6.2pt;letter-spacing:.09em;text-transform:uppercase;color:var(--cinza);margin-top:8px}
.obs{font-size:8.2pt;line-height:1.32;color:var(--marrom-esc);margin-top:2px}

.rodape{margin-top:auto;padding-top:8mm}
.dataloc{font-size:9.2pt;margin-bottom:9mm}
.assinaturas{display:flex;gap:14mm}
.ass{flex:1}
.ass .linha{border-top:.7px solid var(--preto)}
.ass .nome{font-size:8.4pt;margin-top:4px;min-height:11pt}
.ass .r{font-size:6.4pt;letter-spacing:.09em;text-transform:uppercase;color:var(--cinza)}
.pe{border-top:.7px solid var(--filete);margin-top:7mm;padding-top:4px;
  display:flex;justify-content:space-between;font-size:7pt;color:var(--cinza)}
.pe .sub{font-size:6.2pt}

@media print{
  body{background:#fff}
  .painel,.previa .rot{display:none !important}
  .previa{max-width:none;margin:0;padding:0}
  .papelwrap{gap:0}
  .folha{width:210mm;min-height:297mm;height:297mm;box-shadow:none;margin:0;page-break-after:always}
  .folha:last-child{page-break-after:auto}
  @page{size:A4;margin:0}
}
@media screen and (max-width:900px){
  .folha{transform:scale(.62);transform-origin:top center;margin-bottom:-105mm}
  .c2,.c3,.c4{grid-column:span 6}
  .c5,.c8{grid-column:span 12}
}
</style>

<script>
/* ------------------------------------------------- emitente (fixo) */
const EMITENTE = {
  razao:"NOVO PARQUE DA SAUDADE LTDA",
  cnpj:"63.612.331/0001-00",
  end:"R. Alencar Tristão, s/n — Santa Terezinha — CEP 36.046-010 — Juiz de Fora/MG",
  tel:""
};
const CIDADE = "Juiz de Fora";

/* ------------------------------------------------- valor por extenso */
const U=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze",
"treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const D=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const C=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
const ESC=[["",""],["mil","mil"],["milhão","milhões"],["bilhão","bilhões"],["trilhão","trilhões"]];
function ate999(n){
  if(!n) return "";
  if(n===100) return "cem";
  const p=[], c=Math.floor(n/100), r=n%100;
  if(c) p.push(C[c]);
  if(r){ if(r<20) p.push(U[r]); else { const d=Math.floor(r/10), u=r%10; p.push(D[d]+(u?" e "+U[u]:"")); } }
  return p.join(" e ");
}
function inteiroExtenso(n){
  n=Math.trunc(n);
  if(n===0) return "zero";
  const g=[]; let m=n;
  while(m>0){ g.push(m%1000); m=Math.floor(m/1000); }
  const partes=[];
  for(let i=g.length-1;i>=0;i--){
    if(!g[i]) continue;
    if(i===1 && g[i]===1) partes.push("mil");
    else { const nome = g[i]===1 ? ESC[i][0] : ESC[i][1]; partes.push(ate999(g[i]) + (nome?" "+nome:"")); }
  }
  if(partes.length===1) return partes[0];
  const ult=g[0], corpo=partes.slice(0,-1).join(", ");
  return (ult && (ult<100 || ult%100===0)) ? corpo+" e "+partes[partes.length-1]
                                           : corpo+", "+partes[partes.length-1];
}
function valorExtenso(v){
  const tot=Math.round(v*100), reais=Math.floor(tot/100), cent=tot%100, p=[];
  if(reais){
    let moeda = reais===1 ? " real" : (reais>=1e6 && reais%1e6===0 ? " de reais" : " reais");
    p.push(inteiroExtenso(reais)+moeda);
  }
  if(cent) p.push(inteiroExtenso(cent)+(cent===1?" centavo":" centavos"));
  return p.length ? p.join(" e ") : "zero real";
}

/* ------------------------------------------------- utilidades */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto",
"setembro","outubro","novembro","dezembro"];
const $ = id => document.getElementById(id);
function num(s){
  if(s===null||s===undefined) return null;
  s=String(s).trim().replace(/[R$\s.]/g,"").replace(",",".");
  if(!s) return null;
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
function brl(n){
  if(n===null) return null;
  return "R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function dbr(iso){
  if(!iso) return null;
  const [a,m,d]=iso.split("-");
  return (d&&m&&a) ? `${d}/${m}/${a}` : null;
}
function dext(iso){
  if(!iso) return `${CIDADE}, _____ de ____________________ de 20____`;
  const [a,m,d]=iso.split("-");
  return `${CIDADE}, ${parseInt(d,10)} de ${MESES[parseInt(m,10)-1]} de ${a}`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function campo(rot,val,peso){
  const vazio = (val===null||val===undefined||val==="");
  return `<div class="campo w${peso||1}"><span class="r">${esc(rot)}</span>
    <span class="v${vazio?" vazio":""}">${vazio?"—":esc(val)}</span></div>`;
}

/* ------------------------------------------------- render */
const CAMPOS = ["numero","data","valor","forma","datapg","descricao","cnome","ccpf","cend","ctel",
"quadra","jazigo","modalidade","contrato","vcontrato","parcela","vencimento","totalpago","saldo",
"assinante","obs"];

function coleta(){
  const d={};
  CAMPOS.forEach(k => d[k] = $(k).value.trim());
  d.quitacao = $("quitacao").checked;
  ["valor","vcontrato","totalpago","saldo"].forEach(k => d[k] = num(d[k]));
  if(d.quitacao){
    if(d.saldo===null) d.saldo = 0;
    if(d.totalpago===null) d.totalpago = d.valor;
    if(d.vcontrato===null) d.vcontrato = d.valor;
  }
  return d;
}
function render(){
  const d = coleta();
  $("folhas").innerHTML = folha(d,"1ª VIA — CLIENTE") + folha(d,"2ª VIA — EMPRESA");
  document.title = d.numero ? `Recibo ${d.numero}` : "Emissor de Recibos · Parque da Saudade";
}
function limpar(){
  CAMPOS.forEach(k => $(k).value = "");
  $("quitacao").checked = false;
  hoje();
  render();
}
function hoje(){
  const t = new Date();
  const iso = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  $("data").value = iso;
  $("datapg").value = iso;
}

document.querySelectorAll("input,select,textarea").forEach(el=>{
  el.addEventListener("input",render);
  el.addEventListener("change",render);
});
hoje();
render();
</script>
